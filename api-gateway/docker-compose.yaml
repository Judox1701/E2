services:
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.18.0-debian}
    restart: always
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9092:9092/tcp"
    networks:
      api-gateway:
      # To reach orders-service/kitchen-service/inventory-service by name -
      # those no longer publish host ports, so this is now the only path in.
      service-mesh:

  # One-shot: registers the orders/kitchen/inventory routes in APISIX (via
  # its etcd-backed Admin API) on every startup. Idempotent (PUT by fixed
  # route id), so safe to rerun - and routes stay editable in apisix-dashboard
  # afterward since they land in the same etcd store either way.
  apisix-routes-init:
    image: curlimages/curl:8.11.0
    container_name: apisix-routes-init
    restart: "no"
    depends_on:
      - apisix
    volumes:
      - ./apisix_routes/routes.sh:/routes.sh:ro
    entrypoint: ["sh", "/routes.sh"]
    networks:
      api-gateway:

  apisix-dashboard:
    image: apache/apisix-dashboard
    restart: always
    volumes:
      - ./apisix_dashboard_conf/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    depends_on:
      - etcd
      - apisix
    ports:
      - "9000:9000/tcp"
    networks:
      api-gateway:

  etcd:
    image: bitnamilegacy/etcd:3.5.11
    restart: always
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379/tcp"
    networks:
      api-gateway:
      
volumes:
  etcd_data:
    driver: local

networks:
  api-gateway:
  service-mesh: